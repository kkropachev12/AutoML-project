[tool.poetry]
package-mode = false
requires-poetry = ">=2.2,<3"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26,<2.0"
pandas = ">=2.2,<2.3"
scikit-learn = ">=1.4,<1.6"
matplotlib = ">=3.8,<3.10"
seaborn = ">=0.13,<0.14"
joblib = ">=1.3,<2.0"
optuna = ">=3.6,<5.0"
mlflow = ">=2.12,<3.0"
psutil = ">=5.9,<8.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ruff = "0.15.4"
pre-commit = ">=4,<5"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Matplotlib's headless backend must be configured before importing pyplot.
"src/visualize.py" = ["E402"]
